name: Build ContextForge on UBI 9

on:
  schedule:
    - cron: '23 9 * * *' # Daily, 09:23 UTC; avoid the busy top of the hour.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional exact stable upstream tag; forces a rebuild'
        required: false
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'scripts/**']

concurrency:
  group: contextforge-ubi9-publisher
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: contextforge

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      has_builds: ${{ steps.releases.outputs.has_builds }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          FORCE_LATEST: ${{ github.event_name == 'push' }}
        run: python3 scripts/releases.py

  build:
    needs: discover
    if: needs.discover.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: builder
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: IBM/mcp-context-forge
          ref: ${{ matrix.tag }}
          path: upstream
          persist-credentials: false
      - id: source
        working-directory: upstream
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream
          file: upstream/Containerfile
          platforms: linux/amd64
          load: true
          tags: contextforge-ubi9:test
          build-args: |
            UBI_BASE=registry.access.redhat.com/ubi9/ubi:latest
            NODEJS_IMAGE=registry.access.redhat.com/ubi9/nodejs-20:latest
            UBI_MINIMAL=registry.access.redhat.com/ubi9/ubi-minimal:latest
            ENABLE_RUST=false
            ENABLE_FIPS=false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ matrix.tag }}
            org.opencontainers.image.licenses=Apache-2.0
            io.contextforge.upstream=https://github.com/IBM/mcp-context-forge
          cache-from: type=gha,scope=ubi9-amd64
          cache-to: type=gha,mode=max,scope=ubi9-amd64
      - name: Verify UBI 9 base
        run: docker run --rm --entrypoint /bin/sh contextforge-ubi9:test -c 'grep -Eq "release 9[.]" /etc/redhat-release'
      - name: Test default entrypoint
        run: bash builder/scripts/smoke-test.sh contextforge-ubi9:test default
      - name: Test TrueNAS Uvicorn entrypoint
        run: bash builder/scripts/smoke-test.sh contextforge-ubi9:test uvicorn
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-logs-${{ matrix.image_tag }}
          path: smoke-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: contextforge-ubi9:test
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Scan for fixable high and critical vulnerabilities
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          only-fixed: true
          fail-build: true
          severity-cutoff: high
          cache-db: true
          output-format: table
      - name: Upload image SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.image_tag }}
          path: sbom.spdx.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish tested image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ matrix.image_tag }}
          IS_LATEST: ${{ matrix.latest }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          image="ghcr.io/${OWNER,,}/${IMAGE_NAME}"
          # Manual rebuilding an older version must never move latest backwards.
          if [ "$IS_LATEST" = true ] && [ -z "$MANUAL_TAG" ]; then
            docker tag contextforge-ubi9:test "$image:latest"
            docker push "$image:latest"
          fi
          # Publish the version last: discovery treats it as the completion marker.
          docker tag contextforge-ubi9:test "$image:$VERSION"
          docker push "$image:$VERSION"
          echo "Published $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
